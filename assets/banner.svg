<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius: 16px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Filters -->
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    /* Animated floating particles and pulses */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.15) translate(30px, -20px); opacity: 0.55; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.25; }
      50% { transform: scale(1.2) translate(-25px, 20px); opacity: 0.45; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-1.5deg); }
    }
    @keyframes dashFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes waveSlide {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .orb-1 { animation: pulseOrb 10s ease-in-out infinite; }
    .orb-2 { animation: pulseOrb2 12s ease-in-out infinite; }
    .card-float-1 { animation: floatCard1 6s ease-in-out infinite; }
    .card-float-2 { animation: floatCard2 7s ease-in-out infinite; }
    .flowing-path {
      stroke-dasharray: 8, 8;
      animation: dashFlow 20s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Animated Ambient Light Orbs (Background layer) -->
  <circle class="orb-1" cx="200" cy="80" r="180" fill="url(#glowGrad1)" filter="url(#blurGlow)" />
  <circle class="orb-2" cx="1020" cy="260" r="220" fill="url(#glowGrad2)" filter="url(#blurGlow)" />

  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="250" y1="0" x2="250" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="550" y1="0" x2="550" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="850" y1="0" x2="850" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
  </g>

  <!-- Flowing Dynamic Curves (Behind foreground) -->
  <path class="flowing-path" d="M -50,280 C 300,340 500,160 850,220 C 1050,260 1150,140 1250,180" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />
  <path class="flowing-path" d="M -50,100 C 250,40 600,260 900,120 C 1050,60 1150,120 1250,100" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.25" style="animation-direction: reverse; animation-duration: 25s;" />

  <!-- Decorative Floating Mini-Cards in Background / Side regions (kept safely away from title) -->
  <g class="card-float-1" transform="translate(940, 45)" filter="url(#cardGlow)">
    <rect width="190" height="74" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1" />
    <text x="20" y="30" fill="#38bdf8" font-size="12" font-weight="600">✈️ FLIGHT &amp; HOTEL</text>
    <text x="20" y="52" fill="#ffffff" font-size="15" font-weight="700">$1,420.50</text>
    <rect x="135" y="36" width="38" height="18" rx="9" fill="#10b981" fill-opacity="0.2" />
    <text x="142" y="49" fill="#34d399" font-size="10" font-weight="700">✓ SYNC</text>
  </g>

  <g class="card-float-2" transform="translate(970, 225)" filter="url(#cardGlow)">
    <rect width="180" height="70" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.2" stroke-width="1" />
    <text x="18" y="28" fill="#c084fc" font-size="11" font-weight="600">🧾 AI RECEIPT OCR</text>
    <text x="18" y="50" fill="#f8fafc" font-size="14" font-weight="700">Policy Approved</text>
    <circle cx="150" cy="40" r="10" fill="#818cf8" fill-opacity="0.2" />
    <path d="M146 40 L149 43 L155 37" stroke="#a5b4fc" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>

  <!-- FOREGROUND: Main Title, Badge & Subtitle (High contrast, clearly visible) -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="250" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="14" cy="14" r="5" fill="#38bdf8" />
      <text x="28" y="18" fill="#94a3b8" font-size="11.5" font-weight="600" letter-spacing="1">CURATED AWESOME DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="140" fill="url(#primaryGrad)" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Travel &amp; Expense
    </text>
    <text x="0" y="190" fill="#ffffff" font-size="34" font-weight="700" letter-spacing="-0.5">
      Management Solutions 💳✈️
    </text>

    <!-- Subtitle & Value Proposition -->
    <text x="0" y="235" fill="#94a3b8" font-size="16" font-weight="400">
      The definitive index of Enterprise SaaS &amp; Open-Source self-hosted platforms
    </text>
    <text x="0" y="260" fill="#64748b" font-size="14" font-weight="400">
      Spend management • Automated receipt OCR • Corporate card policies • Real-time travel budgets
    </text>

    <!-- Interactive Badges Pill Row -->
    <g transform="translate(0, 290)">
      <g>
        <rect width="110" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
        <text x="14" y="17" fill="#cbd5e1" font-size="11.5" font-weight="600">🏢 Top SaaS</text>
      </g>
      <g transform="translate(122, 0)">
        <rect width="135" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
        <text x="14" y="17" fill="#cbd5e1" font-size="11.5" font-weight="600">💻 FOSS Alternatives</text>
      </g>
      <g transform="translate(269, 0)">
        <rect width="125" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
        <text x="14" y="17" fill="#cbd5e1" font-size="11.5" font-weight="600">🤖 AI Receipt OCR</text>
      </g>
      <g transform="translate(406, 0)">
        <rect width="120" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
        <text x="14" y="17" fill="#cbd5e1" font-size="11.5" font-weight="600">📊 Pricing &amp; Stars</text>
      </g>
    </g>
  </g>
</svg>
